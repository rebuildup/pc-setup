# newsyslog.d entry for the pc-setup Kanata daemon log.
# Kanata 1.12.0 emits a virtual_hid_keyboard_ready line roughly once per
# second under launchd, so the log grows without bound unless rotated.
# `*` in the when field disables time-based rotation; rotation triggers only
# when the file exceeds 1024 KB and keeps 5 compressed archives (J flag).
/var/log/pc-setup-kanata.log root:wheel 644 5 1024 * J
