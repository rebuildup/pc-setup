# Managed by rebuildup/pc-setup.
# Machine-wide portable CLI/runtime defaults. Project configs override these values.

# The `rust` tool exports RUSTUP_TOOLCHAIN, which rustup ranks above a
# project's rust-toolchain.toml. Letting mise read rust-toolchain.toml makes
# the project's pin the selected mise version, so RUSTUP_TOOLCHAIN carries the
# project pin; a project mise.toml `rust` entry still wins as usual, and the
# global `rust = "stable"` applies only where a project declares neither.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
node = "26"
python = "3.15"
bun = "latest"
pnpm = "latest"
# mise manages Rust on every OS; the core:rust backend drives rustup underneath.
# The Windows exception (a renderer-injected `disable_tools = ["rust"]`) was
# removed on 2026-11-04: that machine had no standalone rustup, so the guard only
# hid mise's own rustup + stable toolchain and left `cargo` unreachable.
# platforms/windows-11/README.md records the incident history and the no-coexistence
# rule that replaces the guard.
rust = "stable"

gh = "latest"
infisical = "latest"
claude = "latest"
codex = "latest"
# OpenCode 2 is distributed as @opencode/cli on npm; the legacy `opencode` tool
# (aqua:anomalyco/opencode) only tracks the 1.x GitHub releases.
"npm:@opencode/cli" = { version = "latest", depends = ["node"], allow_builds = ["@opencode/cli"] }
worktrunk = "latest"
# herdr: the aqua registry entry lags the GitHub releases, so Windows pins the GitHub
# backend below (same as the maintained machine: 0.9.5 vs aqua 0.9.3). Linux/macOS
# keep the registry entry unchanged.
herdr = { version = "latest", os = ["linux", "macos"] }

gcloud = { version = "latest", os = ["linux", "macos"] }
aws-cli = { version = "latest", os = ["linux", "macos"] }
supabase = "latest"
vercel = { version = "latest", depends = ["node"] }

"npm:npkill" = { version = "latest", depends = ["node"] }

# Rust CLI tools, installed by the cargo backend with the mise-managed Rust
# toolchain; `depends = ["rust"]` installs the toolchain first. The
# Windows-scoped ones are the tools this machine had as `cargo install`
# binaries; they stay scoped to Windows until the other platforms declare
# them too.
"cargo:cargo-clean-all" = { version = "latest", depends = ["rust"] }
"cargo:cargo-cleaner" = { version = "latest", depends = ["rust"], os = ["windows"] }
"cargo:cargo-compete" = { version = "latest", depends = ["rust"], os = ["windows"] }
"cargo:cargo-generate" = { version = "latest", depends = ["rust"], os = ["windows"] }
"cargo:cargo-ndk" = { version = "latest", depends = ["rust"], os = ["windows"] }
"cargo:cargo-update" = { version = "latest", depends = ["rust"], os = ["windows"] }
"cargo:just" = { version = "latest", depends = ["rust"], os = ["windows"] }
"cargo:llmfit" = { version = "latest", depends = ["rust"], os = ["windows"] }
"cargo:tauri-cli" = { version = "latest", depends = ["rust"], os = ["windows"] }
"cargo:wasm-pack" = { version = "latest", depends = ["rust"], os = ["windows"] }
# Git sources resolve to the default branch unless the version names a tag,
# branch or rev. The tags below keep the code this machine runs today, and
# `crate` names the crate because the rtk repository holds more than one.
"cargo:rtk-ai/rtk" = { version = "tag:v0.42.4", crate = "rtk", depends = ["rust"], os = ["windows"] }
"cargo:rust-mcp-stack/rust-mcp-filesystem" = { version = "tag:v0.4.2", depends = ["rust"], os = ["windows"] }

ripgrep = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
bat = "latest"
gdu = "latest"
shellcheck = "latest"
neovim = "latest"
# Windows PowerShell is WinGet-managed (Microsoft.PowerShell); a second mise copy
# would shadow it with an older shim.
powershell = { version = "7.6.9", os = ["linux", "macos"] }
# Pi moved from @mariozechner/pi-coding-agent to @earendil-works/pi-coding-agent
# on 2026-05-07. 1.4.0 sends the x-opencode-session header required by OpenCode
# Go; the old package stops at 0.73.1 and is no longer updated.
"npm:@earendil-works/pi-coding-agent" = "latest"
# dsh (DeepSeek Harness) is only published as prereleases, so the machine-global
# install pins the exact version instead of tracking a rolling selector.
"npm:@deepseek-ai/dsh" = "0.2.0-rc.2"
# OMP (oh-my-pi) is the Worker harness replacing the dotfiles launcher's old Pi
# routes. Native Pi above stays installed for rollback/native use.
oh-my-pi = "latest"
"npm:playwright" = "latest"
ruby = "4"

[tools."github:herdrdev/herdr"]
version = "latest"
bin = "herdr"
os = ["windows"]

[tools."github:herdrdev/herdr".platforms]
# Windows ships a .zip; other platforms ship raw binaries and use the aqua entry.
# Herdr only publishes a Windows x64 asset, so Windows ARM64 falls back to it
# (x64 emulation). Verified against every published release: herdrdev/herdr ships
# herdr-windows-x86_64.zip only, and no herdr-windows-arm64.zip has ever existed.
windows-x64 = { asset_pattern = "herdr-windows-x86_64.zip" }
windows-arm64 = { asset_pattern = "herdr-windows-x86_64.zip" }

[tools."github:alibaba/open-code-review"]
version = "latest"
bin = "ocr"

[tools."github:alibaba/open-code-review".platforms]
linux-x64 = { asset_pattern = "opencodereview-linux-amd64" }
linux-arm64 = { asset_pattern = "opencodereview-linux-arm64" }
macos-x64 = { asset_pattern = "opencodereview-darwin-amd64" }
macos-arm64 = { asset_pattern = "opencodereview-darwin-arm64" }
windows-x64 = { asset_pattern = "opencodereview-windows-amd64.exe" }
windows-arm64 = { asset_pattern = "opencodereview-windows-arm64.exe" }

# macOS-only host packages. This file is the machine-wide config on every OS, so
# each entry carries an explicit `os` condition instead of living in a separate
# file; without it mise would try to apply Homebrew casks/formulae on Windows and
# Linux. Container tooling is Colima plus the Homebrew Docker CLI, Compose and
# Buildx. Docker Desktop is deliberately absent (see ADR-0013).
[bootstrap.packages]
"brew-cask:android-studio" = { version = "latest", os = "macos" }
"brew-cask:figma" = { version = "latest", os = "macos" }
"brew-cask:nani" = { version = "latest", os = "macos" }
"brew-cask:blender" = { version = "latest", os = "macos" }
"brew-cask:google-chrome" = { version = "latest", os = "macos" }
"brew-cask:firefox" = { version = "latest", os = "macos" }
"brew-cask:stablyai/orca/orca" = { version = "latest", os = "macos" }
"brew-cask:swiftbar" = { version = "latest", os = "macos" }
"brew:ffmpeg" = { version = "latest", os = "macos" }
"brew:zsh-autosuggestions" = { version = "latest", os = "macos" }
"brew:colima" = { version = "latest", os = "macos" }
"brew:docker" = { version = "latest", os = "macos" }
"brew:docker-compose" = { version = "latest", os = "macos" }
"brew:docker-buildx" = { version = "latest", os = "macos" }
# Docker Desktop ships docker-credential-osxkeychain and removes it on
# uninstall, which leaves `credsStore` pointing at a helper that no longer
# exists and makes every `docker pull` fail. This formula provides the same
# Keychain-backed helper without Docker Desktop.
"brew:docker-credential-helper" = { version = "latest", os = "macos" }

[bootstrap.packages."macos-app:wiztree"]
version = "1.00"
url = "https://diskanalyzer.com/files/WizTreeMac_1_00.dmg"
sha256 = "557395cc5fbc2c3acdd3e948352ed64d53ca9e11cff2045a74b6fe46a15ed15c"
artifact = "WizTreeMac.app"
os = "macos/arm64"

[settings.github]
# mise resolves a GitHub token from this command when no MISE_GITHUB_TOKEN /
# GITHUB_API_TOKEN / GITHUB_TOKEN is set. mise passes the string through
# unchanged and runs it with its default inline shell: `sh -o errexit -c` on
# Unix, `cmd /c` on Windows. Expansion is therefore the shell's job, and
# cmd.exe expands %VAR% rather than $VAR, so this `$MISE_CREDENTIAL_HOST` form
# only resolves on Unix. scripts/windows-mise-config.ps1 rewrites the line to
# the `%MISE_CREDENTIAL_HOST%` form when it renders the Windows copy, so the
# shared file keeps one portable command instead of a Windows-only string.
credential_command = 'gh auth token --hostname "$MISE_CREDENTIAL_HOST"'
