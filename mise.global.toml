# Managed by rebuildup/pc-setup.
# Machine-wide portable CLI/runtime defaults. Project configs override these values.

# The `rust` tool exports RUSTUP_TOOLCHAIN, which rustup ranks above a
# project's rust-toolchain.toml. Letting mise read rust-toolchain.toml makes
# the project's pin the selected mise version, so RUSTUP_TOOLCHAIN carries the
# project pin; a project mise.toml `rust` entry still wins as usual, and the
# global `rust = "stable"` applies only where a project declares neither.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
node = "26"
python = "3.14"
bun = "latest"
pnpm = "latest"
# Linux/macOS: mise manages Rust. Windows: the existing rustup installation is
# canonical (see platforms/windows-11/README.md); apply-global-mise.ps1 also
# adds `disable_tools = ["rust"]` there so no config can make mise touch it.
rust = { version = "stable", os = ["linux", "macos"] }

gh = "latest"
infisical = "latest"
claude = "latest"
codex = "latest"
# OpenCode 2 is distributed as @opencode/cli on npm; the legacy `opencode` tool
# (aqua:anomalyco/opencode) only tracks the 1.x GitHub releases.
"npm:@opencode/cli" = { version = "latest", depends = ["node"], allow_builds = ["@opencode/cli"] }
worktrunk = "latest"
# herdr: the aqua registry entry lags the GitHub releases, so Windows pins the GitHub
# backend below (same as the maintained machine: 0.9.5 vs aqua 0.9.3). Linux/macOS
# keep the registry entry unchanged.
herdr = { version = "latest", os = ["linux", "macos"] }

gcloud = { version = "latest", os = ["linux", "macos"] }
aws-cli = { version = "latest", os = ["linux", "macos"] }
supabase = "latest"
vercel = { version = "latest", depends = ["node"] }

"npm:npkill" = { version = "latest", depends = ["node"] }
"cargo:cargo-clean-all" = { version = "latest", depends = ["rust"] }

ripgrep = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
bat = "latest"
gdu = "latest"
shellcheck = "latest"
neovim = "latest"
# Windows PowerShell is WinGet-managed (Microsoft.PowerShell); a second mise copy
# would shadow it with an older shim.
powershell = { version = "7.6.6", os = ["linux", "macos"] }
"npm:@mariozechner/pi-coding-agent" = "latest"
"npm:playwright" = "latest"
ruby = "4"

[tools."github:herdrdev/herdr"]
version = "latest"
bin = "herdr"
os = ["windows"]

[tools."github:herdrdev/herdr".platforms]
# Windows ships a .zip; other platforms ship raw binaries and use the aqua entry.
# Herdr only publishes a Windows x64 asset, so Windows ARM64 falls back to it
# (x64 emulation). Verified against every published release: herdrdev/herdr ships
# herdr-windows-x86_64.zip only, and no herdr-windows-arm64.zip has ever existed.
windows-x64 = { asset_pattern = "herdr-windows-x86_64.zip" }
windows-arm64 = { asset_pattern = "herdr-windows-x86_64.zip" }

[tools."github:alibaba/open-code-review"]
version = "latest"
bin = "ocr"

[tools."github:alibaba/open-code-review".platforms]
linux-x64 = { asset_pattern = "opencodereview-linux-amd64" }
linux-arm64 = { asset_pattern = "opencodereview-linux-arm64" }
macos-x64 = { asset_pattern = "opencodereview-darwin-amd64" }
macos-arm64 = { asset_pattern = "opencodereview-darwin-arm64" }
windows-x64 = { asset_pattern = "opencodereview-windows-amd64.exe" }
windows-arm64 = { asset_pattern = "opencodereview-windows-arm64.exe" }

# macOS-only host packages. This file is the machine-wide config on every OS, so
# each entry carries an explicit `os` condition instead of living in a separate
# file; without it mise would try to apply Homebrew casks/formulae on Windows and
# Linux. Container tooling is Colima plus the Homebrew Docker CLI, Compose and
# Buildx. Docker Desktop is deliberately absent (see ADR-0013).
[bootstrap.packages]
"brew-cask:android-studio" = { version = "latest", os = "macos" }
"brew-cask:figma" = { version = "latest", os = "macos" }
"brew-cask:nani" = { version = "latest", os = "macos" }
"brew-cask:blender" = { version = "latest", os = "macos" }
"brew-cask:google-chrome" = { version = "latest", os = "macos" }
"brew-cask:firefox" = { version = "latest", os = "macos" }
"brew-cask:stablyai/orca/orca" = { version = "latest", os = "macos" }
"brew:ffmpeg" = { version = "latest", os = "macos" }
"brew:zsh-autosuggestions" = { version = "latest", os = "macos" }
"brew:colima" = { version = "latest", os = "macos" }
"brew:docker" = { version = "latest", os = "macos" }
"brew:docker-compose" = { version = "latest", os = "macos" }
"brew:docker-buildx" = { version = "latest", os = "macos" }
# Docker Desktop ships docker-credential-osxkeychain and removes it on
# uninstall, which leaves `credsStore` pointing at a helper that no longer
# exists and makes every `docker pull` fail. This formula provides the same
# Keychain-backed helper without Docker Desktop.
"brew:docker-credential-helper" = { version = "latest", os = "macos" }
