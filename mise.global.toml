# Managed by rebuildup/pc-setup.
# Machine-wide portable CLI/runtime defaults. Project configs override these values.

[tools]
node = "24"
python = "3.14"
bun = "latest"
pnpm = "latest"
rust = "stable"

gh = "latest"
infisical = "latest"
claude = "latest"
codex = "latest"
opencode = "latest"
worktrunk = "latest"
herdr = "latest"

gcloud = { version = "latest", os = ["linux", "macos"] }
aws-cli = { version = "latest", os = ["linux", "macos"] }
supabase = "latest"
vercel = { version = "latest", depends = ["node"] }

"npm:npkill" = { version = "latest", depends = ["node"] }
"cargo:cargo-clean-all" = { version = "latest", depends = ["rust"] }

ripgrep = "latest"
fd = "latest"
fzf = "latest"
jq = "latest"
bat = "latest"
gdu = "latest"
shellcheck = "latest"
neovim = "latest"
powershell = "7.6.6"
"npm:@mariozechner/pi-coding-agent" = "latest"
"npm:playwright" = "latest"
ruby = "3"

[tools."github:alibaba/open-code-review"]
version = "latest"
bin = "ocr"

[tools."github:alibaba/open-code-review".platforms]
linux-x64 = { asset_pattern = "opencodereview-linux-amd64" }
linux-arm64 = { asset_pattern = "opencodereview-linux-arm64" }
macos-x64 = { asset_pattern = "opencodereview-darwin-amd64" }
macos-arm64 = { asset_pattern = "opencodereview-darwin-arm64" }
windows-x64 = { asset_pattern = "opencodereview-windows-amd64.exe" }
windows-arm64 = { asset_pattern = "opencodereview-windows-arm64.exe" }

# macOS-only host packages. This file is the machine-wide config on every OS, so
# each entry carries an explicit `os` condition instead of living in a separate
# file; without it mise would try to apply Homebrew casks/formulae on Windows and
# Linux. Container tooling is Colima plus the Homebrew Docker CLI, Compose and
# Buildx. Docker Desktop is deliberately absent (see ADR-0013).
[bootstrap.packages]
"brew-cask:android-studio" = { version = "latest", os = "macos" }
"brew-cask:figma" = { version = "latest", os = "macos" }
"brew-cask:nani" = { version = "latest", os = "macos" }
"brew-cask:blender" = { version = "latest", os = "macos" }
"brew-cask:google-chrome" = { version = "latest", os = "macos" }
"brew-cask:firefox" = { version = "latest", os = "macos" }
"brew-cask:stablyai/orca/orca" = { version = "latest", os = "macos" }
"brew:ffmpeg" = { version = "latest", os = "macos" }
"brew:colima" = { version = "latest", os = "macos" }
"brew:docker" = { version = "latest", os = "macos" }
"brew:docker-compose" = { version = "latest", os = "macos" }
"brew:docker-buildx" = { version = "latest", os = "macos" }
# Docker Desktop ships docker-credential-osxkeychain and removes it on
# uninstall, which leaves `credsStore` pointing at a helper that no longer
# exists and makes every `docker pull` fail. This formula provides the same
# Keychain-backed helper without Docker Desktop.
"brew:docker-credential-helper" = { version = "latest", os = "macos" }
