name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release-*"

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate repository
        run: ./scripts/ci.sh

      - name: Validate mise configuration
        run: |
          curl -fsSL https://mise.run | sh
          "$HOME/.local/bin/mise" trust
          "$HOME/.local/bin/mise" config >/dev/null
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" config >/dev/null
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" install --dry-run

      - name: Validate Open Code Review install channel
        run: |
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" install github:alibaba/open-code-review
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" exec github:alibaba/open-code-review -- ocr version

  powershell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()

          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null

            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )

            if ($parseErrors.Count -gt 0) {
              $errors += $parseErrors
            }
          }

          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Validate inline PowerShell bootstrap invocation
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $bootstrap = Get-Content -LiteralPath ./bootstrap.ps1 -Raw
          if ($bootstrap -match '\$MyInvocation\.MyCommand\.Path') {
            throw 'bootstrap.ps1 must not directly access MyCommand.Path under StrictMode.'
          }

          $probe = @'
          Set-StrictMode -Version Latest
          $scriptPathProperty = $MyInvocation.MyCommand.PSObject.Properties['Path']
          $scriptRoot = if ($scriptPathProperty -and $scriptPathProperty.Value) {
              Split-Path -Parent $scriptPathProperty.Value
          }
          else {
              $null
          }
          $scriptRoot
          '@

          $inlineRoot = Invoke-Expression $probe
          if ($inlineRoot) {
            throw "Invoke-Expression unexpectedly resolved a file-backed script root: $inlineRoot"
          }

          $probePath = Join-Path $TestDrive 'pc-setup-root-probe.ps1'
          Set-Content -LiteralPath $probePath -Value $probe
          $fileRoot = & $probePath
          if ($fileRoot -ne (Split-Path -Parent $probePath)) {
            throw "File-backed script root was not preserved: $fileRoot"
          }

  nix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Evaluate NixOS profile
        run: nix flake check --no-build --no-write-lock-file ./platforms/nixos
