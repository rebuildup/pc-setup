name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release-*"

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate repository
        run: ./scripts/ci.sh

  powershell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()

          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null

            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )

            if ($parseErrors.Count -gt 0) {
              $errors += $parseErrors
            }
          }

          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Validate Windows package manifests
        shell: pwsh
        run: |
          $wingetIds = Get-Content .\platforms\windows-11\winget-packages.txt |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') }

          if ($wingetIds.Count -eq 0) {
            throw 'winget-packages.txt is empty'
          }

          $duplicateIds = $wingetIds |
            Group-Object |
            Where-Object Count -gt 1

          if ($duplicateIds) {
            throw "Duplicate WinGet package IDs: $($duplicateIds.Name -join ', ')"
          }

          $storeLines = Get-Content .\platforms\windows-11\store-packages.txt |
            ForEach-Object { $_.Trim() } |
            Where-Object { $_ -and -not $_.StartsWith('#') }

          foreach ($line in $storeLines) {
            if ($line -notmatch '^[^|]+\|[^|]+) {
              throw "Invalid Store manifest line: $line"
            }
          }
