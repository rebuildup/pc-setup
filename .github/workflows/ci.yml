name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate
        required: false
        type: string
  pull_request:
  push:
    branches:
      - main
      - "release-*"

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      # scripts/ci.sh asks mise which [bootstrap.packages] apply on this host, so
      # the OS scoping of the machine-wide config is checked by mise itself.
      - name: Install mise
        run: |
          curl -fsSL https://mise.run | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Validate repository
        run: ./scripts/ci.sh

      - name: Validate Ubuntu universe bootstrap boundary
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD:/repo:ro" \
            ubuntu:24.04 \
            bash -c '
              set -euo pipefail

              # Reproduce a minimal Ubuntu whose package sources expose only
              # main. Clear package lists so universe packages cannot be found
              # through stale metadata.
              sed -i -E "s/^Components:.*/Components: main/" /etc/apt/sources.list.d/ubuntu.sources
              rm -rf /var/lib/apt/lists/*
              apt-get update >/dev/null

              if grep -Eq "^Components:.*(^|[[:space:]])universe([[:space:]]|$)" /etc/apt/sources.list.d/ubuntu.sources; then
                echo "universe unexpectedly enabled before preflight" >&2
                exit 1
              fi

              bash /repo/platforms/ubuntu-wsl/prepare-apt.sh

              grep -Eq "^Components:.*(^|[[:space:]])universe([[:space:]]|$)" /etc/apt/sources.list.d/ubuntu.sources

              for package in git-lfs ninja-build clang lldb tree python3-venv; do
                apt-cache show "$package" >/dev/null
              done

              # The preflight must remain safe to rerun.
              bash /repo/platforms/ubuntu-wsl/prepare-apt.sh
            '

      - name: Validate dotfiles checkout convergence
        run: |
          set -euo pipefail

          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          origin="$root/origin.git"
          seed="$root/seed"
          checkout="$root/dotfiles"
          fresh_checkout="$root/dotfiles-fresh"

          git init --bare "$origin"
          git init -b main "$seed"
          git -C "$seed" config user.name 'pc-setup CI'
          git -C "$seed" config user.email 'pc-setup-ci@example.invalid'

          mkdir -p "$seed/script"
          cat > "$seed/script/bootstrap" <<'SH'
          #!/usr/bin/env bash
          printf '%s\n' v1
          SH
          chmod +x "$seed/script/bootstrap"
          printf '%s\n' v1 > "$seed/state.txt"
          git -C "$seed" add script/bootstrap state.txt
          git -C "$seed" commit -m v1
          git -C "$seed" remote add origin "$origin"
          git -C "$seed" push -u origin main

          git clone --branch main --single-branch "$origin" "$checkout"

          printf '%s\n' v2 > "$seed/state.txt"
          git -C "$seed" commit -am v2
          git -C "$seed" push origin main

          DOTFILES_REPO_URL="$origin" DOTFILES_DIR="$checkout" ./scripts/sync-dotfiles.sh
          test "$(cat "$checkout/state.txt")" = v2
          test "$(git -C "$checkout" rev-parse HEAD)" = "$(git -C "$seed" rev-parse HEAD)"

          # Rerun must converge without changing the checkout.
          before="$(git -C "$checkout" rev-parse HEAD)"
          DOTFILES_REPO_URL="$origin" DOTFILES_DIR="$checkout" ./scripts/sync-dotfiles.sh
          test "$(git -C "$checkout" rev-parse HEAD)" = "$before"

          # Fresh clone uses the same convergence boundary.
          DOTFILES_REPO_URL="$origin" DOTFILES_DIR="$fresh_checkout" ./scripts/sync-dotfiles.sh
          test "$(cat "$fresh_checkout/state.txt")" = v2

          # Never discard local work while trying to reach desired state.
          printf '%s\n' dirty >> "$checkout/state.txt"
          set +e
          DOTFILES_REPO_URL="$origin" DOTFILES_DIR="$checkout" ./scripts/sync-dotfiles.sh
          status=$?
          set -e
          test "$status" -ne 0
          grep -Fq dirty "$checkout/state.txt"

          grep -Fq 'bash scripts/sync-dotfiles.sh && bash scripts/apply-platform.sh && mise -C' mise.toml
          grep -Fq 'bash "$pc_setup_dir/scripts/sync-dotfiles.sh"' platforms/nixos/flake.nix

      - name: Validate NixOS checkout convergence
        run: |
          set -euo pipefail

          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          origin="$root/origin.git"
          seed="$root/seed"
          checkout="$root/checkout"

          git init --bare "$origin"
          git init -b main "$seed"
          git -C "$seed" config user.name 'pc-setup CI'
          git -C "$seed" config user.email 'pc-setup-ci@example.invalid'

          printf '%s\n' main > "$seed/state.txt"
          git -C "$seed" add state.txt
          git -C "$seed" commit -m main
          git -C "$seed" remote add origin "$origin"
          git -C "$seed" push -u origin main

          git -C "$seed" switch -c test-ref
          printf '%s\n' test-ref > "$seed/state.txt"
          git -C "$seed" commit -am 'test ref'
          git -C "$seed" push -u origin test-ref

          git clone --branch main --single-branch "$origin" "$checkout"
          bash ./platforms/nixos/sync-checkout.sh "$origin" test-ref "$checkout"

          test "$(git -C "$checkout" branch --show-current)" = test-ref
          test "$(cat "$checkout/state.txt")" = test-ref
          test "$(git -C "$checkout" rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" = origin/test-ref

      - name: Validate NixOS shell init convergence
        run: |
          set -euo pipefail

          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          export HOME="$root/home"
          baseline="$HOME/.local/state/pc-setup/nix-user-baseline"
          mkdir -p "$baseline/bin"

          bash ./platforms/nixos/configure-shell.sh "$baseline"
          bash ./platforms/nixos/configure-shell.sh "$baseline"

          test "$(grep -Fc '# >>> pc-setup shell init >>>' "$HOME/.bashrc")" = 1
          test "$(grep -Fc '# >>> pc-setup shell init >>>' "$HOME/.profile")" = 1
          grep -Fq '.config/pc-setup/shell-init.bash' "$HOME/.bashrc"
          grep -Fq 'nix-user-baseline/bin' "$HOME/.config/pc-setup/shell-init.bash"
          grep -Fq 'wt config shell init bash' "$HOME/.config/pc-setup/shell-init.bash"
          grep -Fq '.dotfiles/script/agent' "$HOME/.config/pc-setup/shell-init.bash"
          grep -Fq 'agent/mimo' "$HOME/.config/pc-setup/shell-init.bash"

          # Once Home Manager owns the rc files they are declarative symlinks.
          # Re-running bootstrap must preserve those links instead of replacing
          # or mutating their Nix-store-like targets.
          managed_dir="$root/managed"
          mkdir -p "$managed_dir"
          printf '%s\n' '# Home Manager managed bashrc' > "$managed_dir/bashrc"
          printf '%s\n' '# Home Manager managed profile' > "$managed_dir/profile"
          rm -f "$HOME/.bashrc" "$HOME/.profile"
          ln -s "$managed_dir/bashrc" "$HOME/.bashrc"
          ln -s "$managed_dir/profile" "$HOME/.profile"

          bash ./platforms/nixos/configure-shell.sh "$baseline"

          test -L "$HOME/.bashrc"
          test -L "$HOME/.profile"
          test "$(cat "$managed_dir/bashrc")" = '# Home Manager managed bashrc'
          test "$(cat "$managed_dir/profile")" = '# Home Manager managed profile'

          grep -Fq 'source "$HOME/.config/pc-setup/shell-init.bash"' platforms/nixos/modules/home.nix

      - name: Validate GitHub auth ordering and bounded mise install retry
        run: |
          set -euo pipefail

          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          fake_bin="$root/bin"
          mkdir -p "$fake_bin" "$root/home"
          state="$root/full-install-count"
          auth_state="$root/gh-authenticated"
          log="$root/mise.log"

          cat > "$fake_bin/mise" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          args="$*"
          token_state=none
          if [[ -n "${MISE_GITHUB_TOKEN:-}" ]]; then
            token_state=set
          fi
          printf '%s|%s|%s|token=%s\n' "${MISE_HTTP_TIMEOUT:-unset}" "${MISE_HTTP_RETRIES:-unset}" "$args" "$token_state" >> "$FAKE_MISE_LOG"

          if [[ "$args" == "-C $HOME install gh" ]]; then
            exit 0
          fi

          if [[ "$args" == "-C $HOME exec gh -- gh auth status --hostname github.com" ]]; then
            [[ -f "$FAKE_GH_AUTH_STATE" ]]
            exit
          fi

          if [[ "$args" == "-C $HOME exec gh -- gh auth login --hostname github.com --git-protocol https --web" ]]; then
            test "${GIT_CONFIG_GLOBAL:-}" = "$HOME/.gitconfig.local"
            : > "$FAKE_GH_AUTH_STATE"
            exit 0
          fi

          if [[ "$args" == "-C $HOME exec gh -- gh auth token --hostname github.com" ]]; then
            [[ -f "$FAKE_GH_AUTH_STATE" ]] || exit 1
            printf '%s\n' 'gho_ci_test_token'
            exit 0
          fi

          # Global packages are applied once GitHub authentication has been
          # prepared, so a fresh tap or cask download can use it.
          if [[ "$args" == "-C $HOME bootstrap packages apply --yes" ]]; then
            test "${MISE_GITHUB_TOKEN:-}" = 'gho_ci_test_token'
            exit 0
          fi

          if [[ "$args" == "-C $HOME install" ]]; then
            test "${MISE_GITHUB_TOKEN:-}" = 'gho_ci_test_token'

            count=0
            if [[ -f "$FAKE_MISE_STATE" ]]; then
              count="$(cat "$FAKE_MISE_STATE")"
            fi
            count=$((count + 1))
            printf '%s\n' "$count" > "$FAKE_MISE_STATE"

            if [[ "${FAKE_MISE_ALWAYS_FAIL:-0}" == "1" || "$count" == "1" ]]; then
              exit 42
            fi
            exit 0
          fi

          printf 'unexpected mise invocation: %s\n' "$args" >&2
          exit 99
          SH
          chmod +x "$fake_bin/mise"

          export PATH="$fake_bin:$PATH"
          export HOME="$root/home"
          export MISE_GLOBAL_CONFIG_FILE="$root/config.toml"
          # A checkout that carries mise.global.lock would switch this script to
          # `install --locked`, which the strict fake mise above rejects. Locked
          # installs are asserted by the global-lock-adoption step; this one stays
          # on the plain invocation whichever branch the checkout comes from.
          export PC_SETUP_MISE_SOURCE_LOCK_FILE="$root/absent.lock"
          export FAKE_MISE_STATE="$state"
          export FAKE_GH_AUTH_STATE="$auth_state"
          export FAKE_MISE_LOG="$log"
          export PC_SETUP_ALLOW_INTERACTIVE_AUTH=1
          export PC_SETUP_MISE_RETRY_DELAY_SECONDS=0

          # Reproduce a fresh user shell rather than GitHub Actions' own
          # authenticated environment.
          unset GITHUB_TOKEN GITHUB_API_TOKEN MISE_GITHUB_TOKEN

          ./scripts/apply-global-mise.sh

          test -f "$auth_state"
          test "$(cat "$state")" = 2
          grep -Fxq "120s|5|-C $HOME install gh|token=none" "$log"
          grep -Fxq "120s|5|-C $HOME exec gh -- gh auth login --hostname github.com --git-protocol https --web|token=none" "$log"
          grep -Fxq "120s|5|-C $HOME bootstrap packages apply --yes|token=set" "$log"
          grep -Fxq "120s|5|-C $HOME install|token=set" "$log"

          gh_install_line="$(grep -nF "|-C $HOME install gh|" "$log" | head -n1 | cut -d: -f1)"
          auth_line="$(grep -nF "|-C $HOME exec gh -- gh auth login " "$log" | head -n1 | cut -d: -f1)"
          packages_line="$(grep -nF "|-C $HOME bootstrap packages apply --yes|" "$log" | head -n1 | cut -d: -f1)"
          full_install_line="$(grep -nF "|-C $HOME install|token=set" "$log" | head -n1 | cut -d: -f1)"
          test "$gh_install_line" -lt "$auth_line"
          test "$auth_line" -lt "$packages_line"
          test "$packages_line" -lt "$full_install_line"

          rm -f "$state" "$log"
          export FAKE_MISE_ALWAYS_FAIL=1

          set +e
          ./scripts/apply-global-mise.sh
          status=$?
          set -e

          test "$status" = 42
          test "$(cat "$state")" = 2
          if grep -Fq 'gh auth login' "$log"; then
            printf 'already-authenticated retry unexpectedly repeated gh login\n' >&2
            exit 1
          fi
          grep -Fxq "120s|5|-C $HOME install|token=set" "$log"

      - name: Validate global lock adoption
        run: |
          set -euo pipefail

          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          fake_bin="$root/bin"
          mkdir -p "$fake_bin" "$root/home"
          log="$root/mise.log"
          source_lock="$root/adopted.lock"
          # mise reads `mise.lock` for a config named `config.toml`, so this is
          # the path the script has to derive on its own. Pinning it through
          # MISE_GLOBAL_LOCK_FILE would hide a wrong derivation from this test.
          target_lock="$root/mise.lock"

          cat > "$fake_bin/mise" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          printf '%s\n' "$*" >> "$FAKE_MISE_LOG"
          exit 0
          SH
          chmod +x "$fake_bin/mise"

          export PATH="$fake_bin:$PATH"
          export HOME="$root/home"
          export FAKE_MISE_LOG="$log"
          export MISE_GLOBAL_CONFIG_FILE="$root/config.toml"
          export PC_SETUP_MISE_SOURCE_LOCK_FILE="$source_lock"
          export MISE_GITHUB_TOKEN="ci-token"

          : > "$source_lock"
          ./scripts/apply-global-mise.sh

          test -L "$target_lock"
          test "$(readlink "$target_lock")" = "$source_lock"
          grep -Fxq -- "-C $HOME install --locked" "$log"

          : > "$log"
          rm "$source_lock"
          ./scripts/apply-global-mise.sh

          test ! -e "$target_lock"
          grep -Fxq -- "-C $HOME install" "$log"
          if grep -Fq -- "--locked" "$log"; then
            echo "locked mode remained enabled after adopted lock was removed" >&2
            exit 1
          fi

      - name: Validate mise configuration
        run: |
          curl -fsSL https://mise.run | sh
          "$HOME/.local/bin/mise" trust
          "$HOME/.local/bin/mise" config >/dev/null
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" config >/dev/null
          install_args=(install --dry-run)
          if [[ -f "$PWD/mise.global.lock" ]]; then
            install_args+=(--locked)
          fi
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" "${install_args[@]}"

      - name: Validate continuous update resolution
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" lock --global --bump --dry-run \
            --platform linux-x64,windows-x64,macos-x64,macos-arm64 \
            --json > "$RUNNER_TEMP/mise-update-dry-run.json"
          jq -e 'type == "array"' "$RUNNER_TEMP/mise-update-dry-run.json" >/dev/null

      - name: Validate Open Code Review install channel
        run: |
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" install github:alibaba/open-code-review
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" exec github:alibaba/open-code-review -- ocr version

  powershell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()

          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null

            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )

            if ($parseErrors.Count -gt 0) {
              $errors += $parseErrors
            }
          }

          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Validate inline PowerShell bootstrap invocation
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $bootstrap = Get-Content -LiteralPath ./bootstrap.ps1 -Raw
          if ($bootstrap -match '\$MyInvocation\.MyCommand\.Path') {
            throw 'bootstrap.ps1 must not directly access MyCommand.Path under StrictMode.'
          }

          $probe = @'
          Set-StrictMode -Version Latest
          $scriptPathProperty = $MyInvocation.MyCommand.PSObject.Properties['Path']
          $scriptRoot = if ($scriptPathProperty -and $scriptPathProperty.Value) {
              Split-Path -Parent $scriptPathProperty.Value
          }
          else {
              $null
          }
          if ($scriptRoot) { "ROOT=$scriptRoot" } else { 'NO_ROOT' }
          '@

          $inlineCommand = "Invoke-Expression @'`n$probe`n'@"
          $encodedCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($inlineCommand))
          $inlineResult = & pwsh -NoProfile -NonInteractive -EncodedCommand $encodedCommand
          if ($LASTEXITCODE -ne 0) {
            throw "Inline PowerShell probe failed with exit code $LASTEXITCODE"
          }
          if ($inlineResult -ne 'NO_ROOT') {
            throw "Inline invocation unexpectedly resolved a file-backed script root: $inlineResult"
          }

          $probePath = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-root-probe-$([guid]::NewGuid()).ps1"
          try {
            Set-Content -LiteralPath $probePath -Value $probe
            $fileResult = & $probePath
            $expectedRoot = "ROOT=$(Split-Path -Parent $probePath)"
            if ($fileResult -ne $expectedRoot) {
              throw "File-backed script root was not preserved: $fileResult"
            }
          }
          finally {
            Remove-Item -LiteralPath $probePath -Force -ErrorAction SilentlyContinue
          }

      - name: Validate Notion MSIX boundary
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $miseConfig = Get-Content -LiteralPath ./mise.toml -Raw
          if ($miseConfig -match 'winget:Notion\.Notion') {
            throw 'Notion must not be part of the mandatory mise WinGet package phase.'
          }

          $bootstrap = Get-Content -LiteralPath ./bootstrap.ps1 -Raw
          foreach ($expected in @(
            'https://www.notion.com/desktop/windows-msix/download',
            'https://www.notion.com/desktop/windows-msix-arm/download',
            'Add-AppxPackage'
          )) {
            if (-not $bootstrap.Contains($expected)) {
              throw "Missing Notion MSIX boundary marker: $expected"
            }
          }

          $verify = Get-Content -LiteralPath ./platforms/windows-11/verify.ps1 -Raw
          if (-not $verify.Contains("Write-Fail 'Notion missing'")) {
            throw 'Windows verification must fail when Notion is absent.'
          }

          if ($bootstrap -match '\$mise\.Source') {
            throw 'bootstrap.ps1 must not invoke mise through the Source property.'
          }
          if (-not $bootstrap.Contains('Get-Command mise -CommandType Application -All')) {
            throw 'bootstrap.ps1 must resolve mise as an application command.'
          }
          if (-not $bootstrap.Contains('& $mise bootstrap --yes')) {
            throw 'bootstrap.ps1 must invoke the selected mise CommandInfo directly.'
          }

      - name: Validate best-effort Windows desktop apps
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $miseConfig = Get-Content -LiteralPath ./mise.toml -Raw
          $inventory = Import-PowerShellDataFile -LiteralPath ./platforms/windows-11/apps.psd1
          if (-not ($inventory.WingetApps | Where-Object Id -eq 'Microsoft.Teams')) {
            throw 'Microsoft.Teams must remain in the shared desktop app inventory.'
          }

          foreach ($app in $inventory.WingetApps) {
            if ($miseConfig.Contains("winget:$($app.Id)")) {
              throw "$($app.Id) must not be in the mandatory mise package phase."
            }
          }

          $verify = Get-Content -LiteralPath ./platforms/windows-11/verify.ps1 -Raw
          if (-not $verify.Contains('Import-PowerShellDataFile -LiteralPath (Join-Path $ScriptDir ''apps.psd1'')')) {
            throw 'Windows verification must consume the shared desktop app inventory.'
          }

          $root = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-apps-$([guid]::NewGuid())"
          $fakeBin = Join-Path $root 'bin'
          $inventoryPath = Join-Path $root 'apps.psd1'
          $logPath = Join-Path $root 'winget.log'
          New-Item -ItemType Directory -Path $fakeBin -Force | Out-Null

          try {
            @'
          @{
              WingetApps = @(
                  @{ Id = 'Fail.App'; Name = 'Fail App' }
                  @{ Id = 'Next.App'; Name = 'Next App' }
              )
          }
          '@ | Set-Content -LiteralPath $inventoryPath

            @'
          @echo off
          if "%1"=="list" exit /b 1
          if "%1"=="install" (
            echo %3>>"%FAKE_WINGET_LOG%"
            if "%3"=="Fail.App" exit /b 42
            exit /b 0
          )
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $fakeBin 'winget.cmd')

            $oldPath = $env:PATH
            $env:FAKE_WINGET_LOG = $logPath
            $env:PATH = "$fakeBin;$oldPath"

            & ./platforms/windows-11/install-apps.ps1 -InventoryPath $inventoryPath

            $attempted = @(Get-Content -LiteralPath $logPath)
            if ($attempted.Count -ne 2 -or $attempted[0] -ne 'Fail.App' -or $attempted[1] -ne 'Next.App') {
              throw "Desktop app convergence did not continue after failure: $($attempted -join ', ')"
            }
          }
          finally {
            if ($oldPath) { $env:PATH = $oldPath }
            Remove-Item Env:FAKE_WINGET_LOG -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Validate adoption of existing installs
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          . ./platforms/windows-11/app-detection.ps1

          # Uninstall keys without DisplayName must not break enumeration under
          # StrictMode (regression: snapshot.ps1 aborted on a real machine).
          $null = @(Get-InstalledDisplayNames)

          foreach ($file in 'snapshot.ps1', 'verify.ps1') {
            $text = Get-Content -LiteralPath "./platforms/windows-11/$file" -Raw
            if ($text -match 'Where-Object\s+DisplayName\b') {
              throw "$file must not use a bare 'Where-Object DisplayName' under StrictMode."
            }
          }

          $inventory = Import-PowerShellDataFile -LiteralPath ./platforms/windows-11/apps.psd1
          $slack = $inventory.WingetApps | Where-Object Id -eq 'SlackTechnologies.Slack'
          if (-not $slack.AppxName) { throw 'Slack must declare AppxName so a Store/MSIX install is adopted.' }

          $root = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-adopt-$([guid]::NewGuid())"
          $fakeBin = Join-Path $root 'bin'
          $inventoryPath = Join-Path $root 'apps.psd1'
          $logPath = Join-Path $root 'winget.log'
          New-Item -ItemType Directory -Path $fakeBin -Force | Out-Null

          try {
            # Pure detection: winget does not know the app, other channels do.
            $oldPath = $env:PATH
            @'
          @echo off
          exit /b 1
          '@ | Set-Content -LiteralPath (Join-Path $fakeBin 'winget.cmd')
            $env:PATH = "$fakeBin;$oldPath"

            $app = @{ Id = 'Contoso.App'; Name = 'Contoso'; AppxName = '^Contoso\.App$'; DisplayName = '^Contoso Vendor' }
            if ((Get-AppInstallChannel -App $app -DisplayNames @() -AppxPackages @()) -ne $null) { throw 'App must be absent when no channel has it.' }
            if ((Get-AppInstallChannel -App $app -DisplayNames @() -AppxPackages @([pscustomobject]@{ Name = 'Contoso.App' })) -ne 'appx') { throw 'MSIX install must be adopted.' }
            if ((Get-AppInstallChannel -App $app -DisplayNames @('Contoso Vendor 1.0') -AppxPackages @()) -ne 'registry') { throw 'Vendor installer must be adopted.' }

            # install-apps.ps1 must not call `winget install` for an adopted app.
            @'
          @{
              WingetApps = @(
                  @{ Id = 'Contoso.Adopted'; Name = 'Adopted'; AppxName = '^Contoso\.Adopted$' }
                  @{ Id = 'Contoso.Missing'; Name = 'Missing' }
              )
          }
          '@ | Set-Content -LiteralPath $inventoryPath

            @'
          @echo off
          if "%1"=="list" exit /b 1
          if "%1"=="install" (
            echo %3>>"%FAKE_WINGET_LOG%"
            exit /b 0
          )
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $fakeBin 'winget.cmd')

            function Get-AppxPackage { [pscustomobject]@{ Name = 'Contoso.Adopted' } }
            $env:FAKE_WINGET_LOG = $logPath
            & ./platforms/windows-11/install-apps.ps1 -InventoryPath $inventoryPath

            $attempted = @(Get-Content -LiteralPath $logPath)
            if ($attempted.Count -ne 1 -or $attempted[0] -ne 'Contoso.Missing') {
              throw "Only the missing app may be installed, got: $($attempted -join ', ')"
            }
          }
          finally {
            if ($oldPath) { $env:PATH = $oldPath }
            Remove-Item Env:FAKE_WINGET_LOG -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Validate global mise config backup before overwrite
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $root = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-mise-$([guid]::NewGuid())"
          $fakeBin = Join-Path $root 'bin'
          $target = Join-Path $root 'config.toml'
          New-Item -ItemType Directory -Path $fakeBin -Force | Out-Null
          $oldPath = $env:PATH

          try {
            "@echo off`r`nexit /b 0" | Set-Content -LiteralPath (Join-Path $fakeBin 'mise.cmd')
            $env:PATH = "$fakeBin;$oldPath"
            $env:MISE_GLOBAL_CONFIG_FILE = $target
            $env:MISE_GITHUB_TOKEN = 'ci-placeholder'

            # Managed file with a local edit that the repository does not have.
            "# Managed by rebuildup/pc-setup.`n[tools]`nlocal-only = `"1`"" | Set-Content -LiteralPath $target
            & ./scripts/apply-global-mise.ps1

            $backups = @(Get-ChildItem -LiteralPath $root -Filter 'config.toml.pc-setup-backup-*')
            if ($backups.Count -ne 1) { throw "Expected one backup, found $($backups.Count)." }
            if (-not (Select-String -LiteralPath $backups[0].FullName -SimpleMatch 'local-only' -Quiet)) {
              throw 'Backup must preserve the pre-overwrite content.'
            }

            # Re-applying identical content must not create another backup.
            & ./scripts/apply-global-mise.ps1
            $backups = @(Get-ChildItem -LiteralPath $root -Filter 'config.toml.pc-setup-backup-*')
            if ($backups.Count -ne 1) { throw "Idempotent re-apply created extra backups: $($backups.Count)." }

            # Unmanaged files are still refused, not backed up and replaced.
            'user = true' | Set-Content -LiteralPath $target
            $refused = $false
            try { & ./scripts/apply-global-mise.ps1 } catch { $refused = $true }
            if (-not $refused) { throw 'Unmanaged global config must be refused.' }
          }
          finally {
            $env:PATH = $oldPath
            Remove-Item Env:MISE_GLOBAL_CONFIG_FILE, Env:MISE_GITHUB_TOKEN -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      # Regression for the 2026-10-17 incident: a plain mise command on Windows
      # auto-installed rust@stable against the user's rustup toolchain and left
      # rustc.exe/cargo.exe deleted. Everything runs in throwaway MISE_*/RUSTUP_HOME/
      # CARGO_HOME directories and uses `install --dry-run`, so no real toolchain
      # is ever touched.
      - name: Validate mise never manages Rust or PowerShell on Windows
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $root = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-rust-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $root | Out-Null
          $oldPath = $env:PATH
          $repo = (Get-Location).Path

          try {
            # 1. Generate the Windows copy of the global config (fake mise: the
            #    apply script's `mise install` must not run for real here).
            $fakeBin = Join-Path $root 'fakebin'
            New-Item -ItemType Directory -Path $fakeBin | Out-Null
            "@echo off`r`nexit /b 0" | Set-Content -LiteralPath (Join-Path $fakeBin 'mise.cmd')
            $generated = Join-Path $root 'generated.toml'
            $env:PATH = "$fakeBin;$oldPath"
            $env:MISE_GLOBAL_CONFIG_FILE = $generated
            $env:MISE_GITHUB_TOKEN = 'ci-placeholder'
            & ./scripts/apply-global-mise.ps1 | Out-Null
            Remove-Item Env:MISE_GLOBAL_CONFIG_FILE, Env:MISE_GITHUB_TOKEN
            $env:PATH = $oldPath
            $text = Get-Content -LiteralPath $generated -Raw
            if ($text -notmatch '(?m)^disable_tools\s*=\s*\["rust"\]') { throw 'Windows config must set disable_tools = ["rust"].' }
            if ($text -match '(?m)^rust\s*=\s*"') { throw 'rust must not be declared without an os condition.' }

            # 2. Real mise, fully isolated.
            $zip = Join-Path $root 'mise.zip'
            Invoke-WebRequest -Uri 'https://github.com/jdx/mise/releases/download/v2026.9.11/mise-v2026.9.11-windows-x64.zip' -OutFile $zip
            Expand-Archive -LiteralPath $zip -DestinationPath (Join-Path $root 'mise-dist')
            $mise = (Get-ChildItem -Path (Join-Path $root 'mise-dist') -Recurse -Filter mise.exe | Select-Object -First 1).FullName

            $env:MISE_DATA_DIR = Join-Path $root 'data'
            $env:MISE_CACHE_DIR = Join-Path $root 'cache'
            $env:MISE_STATE_DIR = Join-Path $root 'state'
            $env:MISE_CONFIG_DIR = Join-Path $root 'cfgdir'
            $env:MISE_TRUSTED_CONFIG_PATHS = $root
            $env:RUSTUP_HOME = Join-Path $root 'rustup'
            $env:CARGO_HOME = Join-Path $root 'cargo'

            $project = Join-Path $root 'project'
            New-Item -ItemType Directory -Path $project | Out-Null
            "[tools]`nrust = `"1.85.0`"" | Set-Content -LiteralPath (Join-Path $project 'mise.toml')
            "[toolchain]`nchannel = `"1.85.0`"" | Set-Content -LiteralPath (Join-Path $project 'rust-toolchain.toml')

            # Trimmed config: the generated [settings] plus only the entries
            # under test (Rust, PowerShell, and a Rust-dependent cargo tool).
            $settings = ($text -split '(?m)^\[tools\]')[0]
            $entries = $text -split "`r?`n" | Where-Object { $_ -match '^(rust|powershell|"cargo:cargo-clean-all")\s*=' }
            if (@($entries).Count -lt 3) { throw "Expected rust, powershell and cargo-clean-all entries, got: $($entries -join ' | ')" }
            $trimmed = Join-Path $root 'trimmed.toml'
            ($settings + "[tools]`n" + ($entries -join "`n") + "`n") | Set-Content -LiteralPath $trimmed

            function Get-DryRun([string]$Config) {
              $env:MISE_GLOBAL_CONFIG_FILE = $Config
              Push-Location $project
              try { return (& $mise install --dry-run 2>&1 | Out-String) } finally { Pop-Location }
            }

            $guarded = Get-DryRun $trimmed
            if ($guarded -match 'rust@') { throw "mise would install Rust on Windows:`n$guarded" }
            if ($guarded -match 'powershell@') { throw "mise would install PowerShell on Windows:`n$guarded" }

            # Control: the pre-fix shape must trigger the install, otherwise this
            # test could not have caught the incident.
            $unguarded = Join-Path $root 'unguarded.toml'
            "[tools]`nrust = `"stable`"`n`"cargo:cargo-clean-all`" = { version = `"latest`", depends = [`"rust`"] }`n" | Set-Content -LiteralPath $unguarded
            $control = Get-DryRun $unguarded
            if ($control -notmatch 'rust@') { throw "Control config did not report a Rust install; the test is not sensitive:`n$control" }

            foreach ($dir in $env:RUSTUP_HOME, $env:CARGO_HOME) {
              if (Test-Path -LiteralPath $dir) { throw "$dir was created; mise touched rustup." }
            }
          }
          finally {
            $env:PATH = $oldPath
            Remove-Item Env:MISE_GLOBAL_CONFIG_FILE, Env:MISE_GITHUB_TOKEN -ErrorAction SilentlyContinue
            Set-Location $repo
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Validate Visual Studio capability check
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          if ((Get-Content -LiteralPath ./mise.toml -Raw) -match '(?m)^"winget:Microsoft\.VisualStudio\.') {
            throw 'mise.toml must not require a specific Visual Studio product.'
          }
          . ./platforms/windows-11/visual-studio.ps1

          $root = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-vs-$([guid]::NewGuid())"
          New-Item -ItemType Directory -Path $root | Out-Null
          try {
            function New-FakeVswhere([string]$Name, [object[]]$Instances) {
              $json = Join-Path $root "$Name.json"
              ConvertTo-Json -InputObject @($Instances) -Depth 6 | Set-Content -LiteralPath $json
              $cmd = Join-Path $root "$Name.cmd"
              "@echo off`r`ntype `"$json`"" | Set-Content -LiteralPath $cmd
              return $cmd
            }
            function New-Package([string]$Id, [string]$Type = 'Component') { @{ id = $Id; type = $Type } }

            $complete = @{
              displayName = 'Visual Studio Community 2026'; installationVersion = '18.0'; installationPath = 'C:\vs'
              packages = @(
                (New-Package 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'),
                (New-Package 'Microsoft.VisualStudio.Component.Windows11SDK.26100'),
                (New-Package 'Microsoft.VisualStudio.Workload.NativeDesktop' 'Workload')
              )
            }
            $noSdk = @{
              displayName = 'Visual Studio Build Tools 2022'; installationVersion = '17.0'; installationPath = 'C:\bt'
              packages = @( (New-Package 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64') )
            }
            # A look-alike must not satisfy the SDK requirement.
            $lookalike = @{
              displayName = 'Lookalike'; installationVersion = '1'; installationPath = 'C:\x'
              packages = @(
                (New-Package 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'),
                (New-Package 'Microsoft.VisualStudio.Component.Windows11Sdk.WindowsPerformanceToolkit')
              )
            }

            $ok = @(Get-VisualStudioStatus -VswherePath (New-FakeVswhere 'ok' @($complete)))
            if ($ok.Count -ne 1 -or $ok[0].Missing.Count -ne 0) { throw 'Any edition/year with MSVC and a Windows SDK must pass.' }
            if ($ok[0].MissingRecommendedWorkloads -notcontains 'Microsoft.VisualStudio.Workload.ManagedDesktop') { throw 'Missing optional workloads must be reported.' }

            $bad = @(Get-VisualStudioStatus -VswherePath (New-FakeVswhere 'bad' @($noSdk)))
            if ($bad[0].Missing -notcontains 'Windows SDK') { throw 'A missing Windows SDK must be reported.' }

            $look = @(Get-VisualStudioStatus -VswherePath (New-FakeVswhere 'look' @($lookalike)))
            if ($look[0].Missing -notcontains 'Windows SDK') { throw 'The performance toolkit must not count as a Windows SDK.' }

            $mixed = @(Get-VisualStudioStatus -VswherePath (New-FakeVswhere 'mixed' @($noSdk, $complete)))
            if (@($mixed | Where-Object { $_.Missing.Count -eq 0 }).Count -ne 1) { throw 'One complete instance among several must satisfy the requirement.' }

            # verify.ps1 only reads; it must not call any installer entry point.
            $verify = Get-Content -LiteralPath ./platforms/windows-11/verify.ps1 -Raw
            foreach ($forbidden in 'vs_installer', 'vs_community', 'setup.exe', '--add', 'modify') {
              if ($verify -match [regex]::Escape($forbidden)) { throw "verify.ps1 must not modify Visual Studio ($forbidden)." }
            }
          }
          finally {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Validate pending apps, Cubase, Tailscale and PowerShell PATH handling
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          . ./platforms/windows-11/app-detection.ps1

          # Cubase: bundled editions such as "Cubase LE AI Elements" are installs.
          foreach ($name in 'Steinberg Cubase LE AI Elements 13', 'Cubase 14', 'Steinberg Cubase Pro 13') {
            if ($name -notmatch $script:CubaseDisplayNamePattern) { throw "$name must be recognised as Cubase." }
          }
          if ('Steinberg Download Assistant' -match $script:CubaseDisplayNamePattern) { throw 'Download Assistant is not Cubase.' }

          # Tailscale: only Running is ok; everything else is a manual boundary.
          if ((Get-TailscaleBackendVerdict -BackendState 'Running') -ne 'ok') { throw 'Running must be ok.' }
          foreach ($state in 'NoState', 'NeedsLogin', 'Stopped', 'Starting', '') {
            if ((Get-TailscaleBackendVerdict -BackendState $state) -ne 'manual') { throw "$state must be a manual boundary." }
          }
          $verify = Get-Content -LiteralPath ./platforms/windows-11/verify.ps1 -Raw
          foreach ($mutating in '\$tailscale\s+(up|login|logout|down|set|set-raw)\b', '\$tailscale\s+serve\s+(--|reset|\d)') {
            if ($verify -match $mutating) { throw "verify.ps1 must not change Tailscale state ($mutating)." }
          }

          # PATH reordering keeps every entry; only the order changes.
          $x64 = 'C:\Program Files\PowerShell\7'
          $x86 = 'C:\Program Files (x86)\PowerShell\7\'
          $path = 'C:\a;C:\Program Files (x86)\PowerShell\7\;C:\b;C:\Program Files\PowerShell\7;C:\c'
          $fixed = Get-ReorderedPath -Path $path -Preferred $x64 -Shadowed $x86
          if ($fixed -ne 'C:\a;C:\Program Files\PowerShell\7;C:\Program Files (x86)\PowerShell\7\;C:\b;C:\c') { throw "Unexpected reorder: $fixed" }
          if ((Get-ReorderedPath -Path $fixed -Preferred $x64 -Shadowed $x86) -ne $fixed) { throw 'Reordering must be idempotent.' }
          $missing = Get-ReorderedPath -Path 'C:\a;C:\Program Files (x86)\PowerShell\7;C:\b' -Preferred $x64 -Shadowed $x86
          if ($missing -ne 'C:\a;C:\Program Files\PowerShell\7;C:\Program Files (x86)\PowerShell\7;C:\b') { throw "Preferred entry must be inserted: $missing" }
          $noX86 = 'C:\a;C:\b'
          if ((Get-ReorderedPath -Path $noX86 -Preferred $x64 -Shadowed $x86) -ne $noX86) { throw 'Without an x86 entry the PATH must be unchanged.' }
          $sortedIn = ($path -split ';' | ForEach-Object { $_.TrimEnd('\').ToLowerInvariant() } | Sort-Object) -join '|'
          $sortedOut = ($fixed -split ';' | ForEach-Object { $_.TrimEnd('\').ToLowerInvariant() } | Sort-Object) -join '|'
          if ($sortedIn -ne $sortedOut) { throw 'Reordering must not add or remove entries.' }

          # Optional apps: a failed install is recorded once and never retried.
          $inventory = Import-PowerShellDataFile -LiteralPath ./platforms/windows-11/apps.psd1
          foreach ($id in 'Microsoft.Teams', 'Warp.Warp') {
            if (-not ($inventory.WingetApps | Where-Object { $_.Id -eq $id -and $_.Optional })) { throw "$id must be optional." }
          }

          $root = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-optional-$([guid]::NewGuid())"
          $fakeBin = Join-Path $root 'bin'
          New-Item -ItemType Directory -Path $fakeBin -Force | Out-Null
          $oldPath = $env:PATH
          try {
            $env:PC_SETUP_STATE_DIR = Join-Path $root 'state'
            $env:FAKE_WINGET_LOG = Join-Path $root 'winget.log'
            @'
          @{
              WingetApps = @(
                  @{ Id = 'Opt.App'; Name = 'Optional'; Optional = $true }
                  @{ Id = 'Req.App'; Name = 'Required' }
              )
          }
          '@ | Set-Content -LiteralPath (Join-Path $root 'apps.psd1')
            @'
          @echo off
          if "%1"=="list" exit /b 1
          if "%1"=="install" (
            echo %3>>"%FAKE_WINGET_LOG%"
            exit /b 42
          )
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $fakeBin 'winget.cmd')
            $env:PATH = "$fakeBin;$oldPath"

            function Get-AppxPackage { @() }
            & ./platforms/windows-11/install-apps.ps1 -InventoryPath (Join-Path $root 'apps.psd1')
            & ./platforms/windows-11/install-apps.ps1 -InventoryPath (Join-Path $root 'apps.psd1')

            $attempts = @(Get-Content -LiteralPath $env:FAKE_WINGET_LOG)
            $optionalAttempts = @($attempts | Where-Object { $_ -eq 'Opt.App' }).Count
            $requiredAttempts = @($attempts | Where-Object { $_ -eq 'Req.App' }).Count
            if ($optionalAttempts -ne 1) { throw "Optional app must be attempted exactly once, was $optionalAttempts." }
            if ($requiredAttempts -ne 2) { throw "Required app keeps being attempted, was $requiredAttempts." }
            $pending = Get-Content -LiteralPath (Join-Path $env:PC_SETUP_STATE_DIR 'pending-apps.json') -Raw | ConvertFrom-Json
            if (-not $pending.PSObject.Properties['Opt.App']) { throw 'Failure of the optional app must be recorded.' }
            if ($pending.PSObject.Properties['Req.App']) { throw 'Required apps must not be recorded as pending.' }
          }
          finally {
            $env:PATH = $oldPath
            Remove-Item Env:PC_SETUP_STATE_DIR, Env:FAKE_WINGET_LOG -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

          # Herdr: Windows pins the GitHub backend (newer than the aqua registry);
          # Linux/macOS keep the registry entry.
          $toml = Get-Content -LiteralPath ./mise.global.toml -Raw
          if ($toml -notmatch '(?m)^herdr = \{ version = "latest", os = \["linux", "macos"\] \}') { throw 'The registry herdr must be limited to linux/macos.' }
          if ($toml -notmatch '(?s)\[tools\."github:herdrdev/herdr"\][^\[]*os = \["windows"\]') { throw 'The GitHub-backend herdr must be Windows-only.' }
          if ($toml -notmatch 'herdr-windows-x86_64\.zip') { throw 'The Windows herdr asset pattern is required.' }
          if ((Get-Content -LiteralPath ./mise.global.lock -Raw) -notmatch 'backend = "github:herdrdev/herdr"') { throw 'mise.global.lock must contain the GitHub-backend herdr.' }

          # The fake winget above leaves a non-zero $LASTEXITCODE, which pwsh would
          # otherwise report as the step's exit code.
          $global:LASTEXITCODE = 0

      - name: Validate Infisical-backed Tailscale provisioning
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $miseConfig = Get-Content -LiteralPath ./mise.toml -Raw
          if (-not $miseConfig.Contains('"winget:Tailscale.Tailscale" = { os = "windows" }')) {
            throw 'Tailscale must be part of the mandatory Windows foundation.'
          }

          $config = Import-PowerShellDataFile -LiteralPath ./platforms/windows-11/tailscale.psd1
          if ($config.Infisical.ApiUrl -ne 'https://secrets.rebuildup.dev/api') {
            throw 'Tailscale provisioning must use the self-hosted Infisical API.'
          }
          if ($config.Infisical.ProjectId -ne 'd4c2fc09-a923-4a38-9cf4-b51769aadb76') {
            throw 'Unexpected Infisical project ID for Tailscale provisioning.'
          }
          if ($config.Infisical.Environment -ne 'prod' -or $config.Infisical.Path -ne '/infrastructure/tailscale') {
            throw 'Unexpected Infisical environment/path for Tailscale provisioning.'
          }
          if ($config.Infisical.RequiredSecrets -notcontains 'TAILSCALE_OAUTH_CLIENT_SECRET') {
            throw 'Tailscale OAuth secret contract is missing.'
          }
          if ($config.Tailscale.AdvertiseTag -ne 'tag:personal-device') {
            throw 'Unexpected Tailscale device tag.'
          }
          if ($config.Tailscale.AuthKeyParameters -ne 'ephemeral=false&preauthorized=true') {
            throw 'Tailscale node registration must be persistent and preauthorized.'
          }

          $expectedMappings = @{
            2222 = 'tcp://127.0.0.1:2222'
            2223 = 'tcp://127.0.0.1:2223'
          }
          foreach ($entry in $expectedMappings.GetEnumerator()) {
            $mapping = $config.Tailscale.Serve |
              Where-Object { $_.ListenPort -eq $entry.Key -and $_.Target -eq $entry.Value } |
              Select-Object -First 1
            if (-not $mapping) {
              throw "Missing Tailscale Serve mapping $($entry.Key) -> $($entry.Value)"
            }
          }

          $setupScript = Get-Content -LiteralPath ./platforms/windows-11/setup-tailscale.ps1 -Raw
          foreach ($marker in @(
            'INFISICAL_API_URL',
            '--projectId=',
            '--env=',
            '--path=',
            '-Injected',
            '$config.Infisical.RequiredSecrets'
          )) {
            if (-not $setupScript.Contains($marker)) {
              throw "Missing Infisical/Tailscale setup marker: $marker"
            }
          }
          if ($setupScript -match 'tskey-') {
            throw 'A Tailscale credential literal must never be committed.'
          }

          $root = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-tailscale-$([guid]::NewGuid())"
          $fakeBin = Join-Path $root 'bin'
          $logPath = Join-Path $root 'tailscale.log'
          New-Item -ItemType Directory -Path $fakeBin -Force | Out-Null

          $oldPath = $null
          try {
            $fakeTailscaleSource = @'
          using System;
          using System.IO;

          public static class Program
          {
              private static string JoinTail(string[] args)
              {
                  return args.Length <= 1
                      ? ""
                      : string.Join(" ", args, 1, args.Length - 1);
              }

              public static int Main(string[] args)
              {
                  string logPath = Environment.GetEnvironmentVariable("FAKE_TAILSCALE_LOG");

                  if (args.Length >= 2 && args[0] == "status" && args[1] == "--json")
                  {
                      string backend = Environment.GetEnvironmentVariable("FAKE_TAILSCALE_BACKEND") ?? "NeedsLogin";
                      Console.WriteLine("{\"BackendState\":\"" + backend + "\"}");
                      return 0;
                  }

                  if (args.Length >= 1 && args[0] == "up")
                  {
                      File.AppendAllText(logPath, "up " + JoinTail(args) + Environment.NewLine);
                      return 0;
                  }

                  if (args.Length >= 2 && args[0] == "serve" && args[1] == "status")
                  {
                      Console.WriteLine("tcp://host.test:2222");
                      Console.WriteLine("|-- tcp://127.0.0.1:2222");
                      Console.WriteLine("tcp://host.test:2223");
                      Console.WriteLine("|-- tcp://127.0.0.1:2223");
                      return 0;
                  }

                  if (args.Length >= 1 && args[0] == "serve")
                  {
                      File.AppendAllText(logPath, "serve " + JoinTail(args) + Environment.NewLine);
                      return 0;
                  }

                  return 99;
              }
          }
          '@
            $sourcePath = Join-Path $root 'FakeTailscale.cs'
            $fakeExe = Join-Path $fakeBin 'tailscale.exe'
            Set-Content -LiteralPath $sourcePath -Value $fakeTailscaleSource

            $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            if (-not (Test-Path -LiteralPath $csc)) {
              $csc = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
            }
            if (-not (Test-Path -LiteralPath $csc)) {
              throw 'Windows .NET Framework C# compiler is unavailable for the Tailscale test double.'
            }

            & $csc /nologo /target:exe "/out:$fakeExe" $sourcePath
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to compile Tailscale test double: exit $LASTEXITCODE"
            }

            $oldPath = $env:PATH
            $env:PATH = "$fakeBin;$oldPath"
            $env:FAKE_TAILSCALE_LOG = $logPath
            $env:FAKE_TAILSCALE_BACKEND = 'NeedsLogin'
            $env:TAILSCALE_OAUTH_CLIENT_SECRET = 'oauth-ci-placeholder'

            & ./platforms/windows-11/setup-tailscale.ps1 -Injected

            $attempts = @(Get-Content -LiteralPath $logPath)
            $expectedUp = 'up --auth-key=oauth-ci-placeholder?ephemeral=false&preauthorized=true --advertise-tags=tag:personal-device'
            if ($attempts -notcontains $expectedUp) {
              throw "Fresh Tailscale registration did not use the expected scoped OAuth parameters: $($attempts -join '; ')"
            }
            foreach ($expected in @(
              'serve --bg --yes --tcp=2222 tcp://127.0.0.1:2222',
              'serve --bg --yes --tcp=2223 tcp://127.0.0.1:2223'
            )) {
              if ($attempts -notcontains $expected) {
                throw "Missing Tailscale Serve convergence call: $expected"
              }
            }

            Clear-Content -LiteralPath $logPath
            $env:FAKE_TAILSCALE_BACKEND = 'Running'

            & ./platforms/windows-11/setup-tailscale.ps1 -Injected

            $rerun = @(Get-Content -LiteralPath $logPath)
            if ($rerun | Where-Object { $_ -like 'up *' }) {
              throw 'Already-connected Tailscale node was unexpectedly re-registered.'
            }
            foreach ($expected in @(
              'serve --bg --yes --tcp=2222 tcp://127.0.0.1:2222',
              'serve --bg --yes --tcp=2223 tcp://127.0.0.1:2223'
            )) {
              if ($rerun -notcontains $expected) {
                throw "Rerun did not preserve Tailscale Serve convergence: $expected"
              }
            }
          }
          finally {
            if ($oldPath) { $env:PATH = $oldPath }
            Remove-Item Env:FAKE_TAILSCALE_LOG -ErrorAction SilentlyContinue
            Remove-Item Env:FAKE_TAILSCALE_BACKEND -ErrorAction SilentlyContinue
            Remove-Item Env:TAILSCALE_OAUTH_CLIENT_SECRET -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Validate arbitrary PC_SETUP_REF tracking
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $root = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-ref-$([guid]::NewGuid())"
          $origin = Join-Path $root 'origin.git'
          $seed = Join-Path $root 'seed'
          $checkout = Join-Path $root 'checkout'
          $fakeBin = Join-Path $root 'bin'
          $secondFakeBin = Join-Path $root 'bin-secondary'

          New-Item -ItemType Directory -Path $root, $seed, $fakeBin, $secondFakeBin -Force | Out-Null

          try {
            git init --bare $origin | Out-Null
            git -C $seed init -b main | Out-Null
            git -C $seed config user.name 'pc-setup CI'
            git -C $seed config user.email 'pc-setup-ci@example.invalid'
            Set-Content -LiteralPath (Join-Path $seed 'state.txt') -Value 'main'
            $seedWindowsDir = Join-Path $seed 'platforms\windows-11'
            New-Item -ItemType Directory -Path $seedWindowsDir -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $seedWindowsDir 'install-apps.ps1') -Value '# test fixture: no-op desktop app convergence'
            git -C $seed add state.txt platforms/windows-11/install-apps.ps1
            git -C $seed commit -m 'main' | Out-Null

            $originUri = [System.Uri]::new($origin).AbsoluteUri
            git -C $seed remote add origin $originUri
            git -C $seed push -u origin main | Out-Null

            git -C $seed switch -c test-ref | Out-Null
            Set-Content -LiteralPath (Join-Path $seed 'state.txt') -Value 'test-ref'
            git -C $seed commit -am 'test ref' | Out-Null
            git -C $seed push -u origin test-ref | Out-Null

            git clone --branch main --single-branch $originUri $checkout | Out-Null
            if ((git -C $checkout branch --list test-ref)) {
              throw 'test-ref unexpectedly exists before bootstrap.'
            }

            @'
          @echo off
          if "%1"=="list" (
            echo Notion Notion.Notion 1.0.0
            exit /b 0
          )
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $fakeBin 'winget.cmd')

            @'
          @echo off
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $fakeBin 'mise.cmd')

          @'
          @echo off
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $secondFakeBin 'mise.cmd')

            $env:PATH = "$fakeBin;$secondFakeBin;$env:PATH"
            $env:PC_SETUP_REPO_URL = $originUri
            $env:PC_SETUP_REF = 'test-ref'
            $env:PC_SETUP_DIR = $checkout

            Invoke-Expression (Get-Content -LiteralPath ./bootstrap.ps1 -Raw)

            $branch = git -C $checkout branch --show-current
            if ($branch -ne 'test-ref') {
              throw "bootstrap did not switch to test-ref: $branch"
            }

            $state = (Get-Content -LiteralPath (Join-Path $checkout 'state.txt') -Raw).Trim()
            if ($state -ne 'test-ref') {
              throw "bootstrap did not fast-forward to test-ref content: $state"
            }

            $upstream = git -C $checkout rev-parse --abbrev-ref --symbolic-full-name '@{upstream}'
            if ($upstream -ne 'origin/test-ref') {
              throw "test-ref does not track origin/test-ref: $upstream"
            }
          }
          finally {
            Remove-Item Env:PC_SETUP_REPO_URL -ErrorAction SilentlyContinue
            Remove-Item Env:PC_SETUP_REF -ErrorAction SilentlyContinue
            Remove-Item Env:PC_SETUP_DIR -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

  nix:
    runs-on: ubuntu-latest
    env:
      # Nix resolves GitHub flake refs through the API. Authenticate those
      # requests so CI is not coupled to the shared runner IP rate limit.
      NIX_CONFIG: access-tokens = github.com=${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Validate NixOS bootstrap documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path("README.md"), Path("platforms/nixos/README.md")]
          required = [
              "--extra-experimental-features 'nix-command flakes'",
              "run --no-write-lock-file 'github:rebuildup/pc-setup?dir=platforms/nixos'",
          ]

          for path in files:
              text = path.read_text()
              for marker in required:
                  if marker not in text:
                      raise SystemExit(f"{path}: missing canonical NixOS bootstrap marker: {marker}")
          PY

      - name: Evaluate NixOS profile
        run: nix flake check --no-build --no-write-lock-file ./platforms/nixos

      - name: Build NixOS mise compatibility wrapper
        run: nix build --no-link --no-write-lock-file ./platforms/nixos#mise-bootstrap-fhs

      - name: Build NixOS persistent CLI wrapper baseline
        run: |
          nix build --no-write-lock-file --out-link result-user-baseline ./platforms/nixos#user-baseline
          for command in git git-lfs mise claude opencode node cargo gdu gcloud wget gcc clang lldb cmake ninja make pkg-config; do
            test -x "result-user-baseline/bin/$command"
          done
          grep -Fq 'mise -C' "$(readlink -f result-user-baseline/bin/claude)"
          grep -Fq 'pc-setup-mise-bootstrap-fhs' "$(readlink -f result-user-baseline/bin/opencode)"

      - name: Validate bootstrap shell activation guidance
        run: |
          grep -Fq 'this process cannot modify the parent shell PATH' platforms/nixos/flake.nix
          grep -Fq 'source %s/.config/pc-setup/shell-init.bash' platforms/nixos/flake.nix
          grep -Fq 'bootstrap is not complete' platforms/nixos/flake.nix
          grep -Fq 'normal_shell_path="$user_baseline_link/bin:/run/current-system/sw/bin:$HOME/.local/bin"' platforms/nixos/flake.nix
          ! grep -Fq 'PATH="$user_baseline_link/bin:$PATH"' platforms/nixos/flake.nix
          grep -Fq 'GitHub HTTPS credential helper is configured through gh' platforms/nixos/verify.sh

      - name: Validate nix-ld boundary
        run: grep -F 'programs.nix-ld.enable = true;' platforms/nixos/modules/system.nix
