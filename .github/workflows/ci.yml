name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release-*"

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate repository
        run: ./scripts/ci.sh

      - name: Validate NixOS checkout convergence
        run: |
          set -euo pipefail

          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          origin="$root/origin.git"
          seed="$root/seed"
          checkout="$root/checkout"

          git init --bare "$origin"
          git init -b main "$seed"
          git -C "$seed" config user.name 'pc-setup CI'
          git -C "$seed" config user.email 'pc-setup-ci@example.invalid'

          printf '%s\n' main > "$seed/state.txt"
          git -C "$seed" add state.txt
          git -C "$seed" commit -m main
          git -C "$seed" remote add origin "$origin"
          git -C "$seed" push -u origin main

          git -C "$seed" switch -c test-ref
          printf '%s\n' test-ref > "$seed/state.txt"
          git -C "$seed" commit -am 'test ref'
          git -C "$seed" push -u origin test-ref

          git clone --branch main --single-branch "$origin" "$checkout"
          bash ./platforms/nixos/sync-checkout.sh "$origin" test-ref "$checkout"

          test "$(git -C "$checkout" branch --show-current)" = test-ref
          test "$(cat "$checkout/state.txt")" = test-ref
          test "$(git -C "$checkout" rev-parse --abbrev-ref --symbolic-full-name '@{upstream}')" = origin/test-ref

      - name: Validate NixOS shell init convergence
        run: |
          set -euo pipefail

          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          export HOME="$root/home"
          baseline="$HOME/.local/state/pc-setup/nix-user-baseline"
          mkdir -p "$baseline/bin"

          bash ./platforms/nixos/configure-shell.sh "$baseline"
          bash ./platforms/nixos/configure-shell.sh "$baseline"

          test "$(grep -Fc '# >>> pc-setup shell init >>>' "$HOME/.bashrc")" = 1
          test "$(grep -Fc '# >>> pc-setup shell init >>>' "$HOME/.profile")" = 1
          grep -Fq '.config/pc-setup/shell-init.bash' "$HOME/.bashrc"
          grep -Fq 'nix-user-baseline/bin' "$HOME/.config/pc-setup/shell-init.bash"
          grep -Fq 'wt config shell init bash' "$HOME/.config/pc-setup/shell-init.bash"

      - name: Validate bounded mise install retry
        run: |
          set -euo pipefail

          root="$(mktemp -d)"
          trap 'rm -rf "$root"' EXIT

          fake_bin="$root/bin"
          mkdir -p "$fake_bin" "$root/home"
          state="$root/mise-count"

          cat > "$fake_bin/mise" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail

          count=0
          if [[ -f "$FAKE_MISE_STATE" ]]; then
            count="$(cat "$FAKE_MISE_STATE")"
          fi
          count=$((count + 1))
          printf '%s\n' "$count" > "$FAKE_MISE_STATE"
          printf '%s|%s|%s\n' "$MISE_HTTP_TIMEOUT" "$MISE_HTTP_RETRIES" "$*" >> "$FAKE_MISE_LOG"

          if [[ "${FAKE_MISE_ALWAYS_FAIL:-0}" == "1" || "$count" == "1" ]]; then
            exit 42
          fi
          exit 0
          SH
          chmod +x "$fake_bin/mise"

          export PATH="$fake_bin:$PATH"
          export HOME="$root/home"
          export MISE_GLOBAL_CONFIG_FILE="$root/config.toml"
          export FAKE_MISE_STATE="$state"
          export FAKE_MISE_LOG="$root/mise.log"
          export PC_SETUP_MISE_RETRY_DELAY_SECONDS=0

          ./scripts/apply-global-mise.sh
          test "$(cat "$state")" = 2
          grep -Fxq "120s|5|-C $HOME install" "$FAKE_MISE_LOG"

          rm -f "$state" "$FAKE_MISE_LOG"
          export FAKE_MISE_ALWAYS_FAIL=1

          set +e
          ./scripts/apply-global-mise.sh
          status=$?
          set -e

          test "$status" = 42
          test "$(cat "$state")" = 2

      - name: Validate mise configuration
        run: |
          curl -fsSL https://mise.run | sh
          "$HOME/.local/bin/mise" trust
          "$HOME/.local/bin/mise" config >/dev/null
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" config >/dev/null
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" install --dry-run

      - name: Validate Open Code Review install channel
        run: |
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" install github:alibaba/open-code-review
          MISE_GLOBAL_CONFIG_FILE="$PWD/mise.global.toml" \
            "$HOME/.local/bin/mise" -C "$HOME" exec github:alibaba/open-code-review -- ocr version

  powershell:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()

          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null

            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )

            if ($parseErrors.Count -gt 0) {
              $errors += $parseErrors
            }
          }

          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Validate inline PowerShell bootstrap invocation
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $bootstrap = Get-Content -LiteralPath ./bootstrap.ps1 -Raw
          if ($bootstrap -match '\$MyInvocation\.MyCommand\.Path') {
            throw 'bootstrap.ps1 must not directly access MyCommand.Path under StrictMode.'
          }

          $probe = @'
          Set-StrictMode -Version Latest
          $scriptPathProperty = $MyInvocation.MyCommand.PSObject.Properties['Path']
          $scriptRoot = if ($scriptPathProperty -and $scriptPathProperty.Value) {
              Split-Path -Parent $scriptPathProperty.Value
          }
          else {
              $null
          }
          if ($scriptRoot) { "ROOT=$scriptRoot" } else { 'NO_ROOT' }
          '@

          $inlineCommand = "Invoke-Expression @'`n$probe`n'@"
          $encodedCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($inlineCommand))
          $inlineResult = & pwsh -NoProfile -NonInteractive -EncodedCommand $encodedCommand
          if ($LASTEXITCODE -ne 0) {
            throw "Inline PowerShell probe failed with exit code $LASTEXITCODE"
          }
          if ($inlineResult -ne 'NO_ROOT') {
            throw "Inline invocation unexpectedly resolved a file-backed script root: $inlineResult"
          }

          $probePath = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-root-probe-$([guid]::NewGuid()).ps1"
          try {
            Set-Content -LiteralPath $probePath -Value $probe
            $fileResult = & $probePath
            $expectedRoot = "ROOT=$(Split-Path -Parent $probePath)"
            if ($fileResult -ne $expectedRoot) {
              throw "File-backed script root was not preserved: $fileResult"
            }
          }
          finally {
            Remove-Item -LiteralPath $probePath -Force -ErrorAction SilentlyContinue
          }

      - name: Validate Notion MSIX boundary
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $miseConfig = Get-Content -LiteralPath ./mise.toml -Raw
          if ($miseConfig -match 'winget:Notion\.Notion') {
            throw 'Notion must not be part of the mandatory mise WinGet package phase.'
          }

          $bootstrap = Get-Content -LiteralPath ./bootstrap.ps1 -Raw
          foreach ($expected in @(
            'https://www.notion.com/desktop/windows-msix/download',
            'https://www.notion.com/desktop/windows-msix-arm/download',
            'Add-AppxPackage'
          )) {
            if (-not $bootstrap.Contains($expected)) {
              throw "Missing Notion MSIX boundary marker: $expected"
            }
          }

          $verify = Get-Content -LiteralPath ./platforms/windows-11/verify.ps1 -Raw
          if (-not $verify.Contains("Write-Fail 'Notion missing'")) {
            throw 'Windows verification must fail when Notion is absent.'
          }

          if ($bootstrap -match '\$mise\.Source') {
            throw 'bootstrap.ps1 must not invoke mise through the Source property.'
          }
          if (-not $bootstrap.Contains('Get-Command mise -CommandType Application -All')) {
            throw 'bootstrap.ps1 must resolve mise as an application command.'
          }
          if (-not $bootstrap.Contains('& $mise bootstrap --yes')) {
            throw 'bootstrap.ps1 must invoke the selected mise CommandInfo directly.'
          }

      - name: Validate best-effort Windows desktop apps
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $miseConfig = Get-Content -LiteralPath ./mise.toml -Raw
          $inventory = Import-PowerShellDataFile -LiteralPath ./platforms/windows-11/apps.psd1
          if (-not ($inventory.WingetApps | Where-Object Id -eq 'Microsoft.Teams')) {
            throw 'Microsoft.Teams must remain in the shared desktop app inventory.'
          }

          foreach ($app in $inventory.WingetApps) {
            if ($miseConfig.Contains("winget:$($app.Id)")) {
              throw "$($app.Id) must not be in the mandatory mise package phase."
            }
          }

          $verify = Get-Content -LiteralPath ./platforms/windows-11/verify.ps1 -Raw
          if (-not $verify.Contains('Import-PowerShellDataFile -LiteralPath (Join-Path $ScriptDir ''apps.psd1'')')) {
            throw 'Windows verification must consume the shared desktop app inventory.'
          }

          $root = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-apps-$([guid]::NewGuid())"
          $fakeBin = Join-Path $root 'bin'
          $inventoryPath = Join-Path $root 'apps.psd1'
          $logPath = Join-Path $root 'winget.log'
          New-Item -ItemType Directory -Path $fakeBin -Force | Out-Null

          try {
            @'
          @{
              WingetApps = @(
                  @{ Id = 'Fail.App'; Name = 'Fail App' }
                  @{ Id = 'Next.App'; Name = 'Next App' }
              )
          }
          '@ | Set-Content -LiteralPath $inventoryPath

            @'
          @echo off
          if "%1"=="list" exit /b 1
          if "%1"=="install" (
            echo %3>>"%FAKE_WINGET_LOG%"
            if "%3"=="Fail.App" exit /b 42
            exit /b 0
          )
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $fakeBin 'winget.cmd')

            $oldPath = $env:PATH
            $env:FAKE_WINGET_LOG = $logPath
            $env:PATH = "$fakeBin;$oldPath"

            & ./platforms/windows-11/install-apps.ps1 -InventoryPath $inventoryPath

            $attempted = @(Get-Content -LiteralPath $logPath)
            if ($attempted.Count -ne 2 -or $attempted[0] -ne 'Fail.App' -or $attempted[1] -ne 'Next.App') {
              throw "Desktop app convergence did not continue after failure: $($attempted -join ', ')"
            }
          }
          finally {
            if ($oldPath) { $env:PATH = $oldPath }
            Remove-Item Env:FAKE_WINGET_LOG -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Validate arbitrary PC_SETUP_REF tracking
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $root = Join-Path ([System.IO.Path]::GetTempPath()) "pc-setup-ref-$([guid]::NewGuid())"
          $origin = Join-Path $root 'origin.git'
          $seed = Join-Path $root 'seed'
          $checkout = Join-Path $root 'checkout'
          $fakeBin = Join-Path $root 'bin'
          $secondFakeBin = Join-Path $root 'bin-secondary'

          New-Item -ItemType Directory -Path $root, $seed, $fakeBin, $secondFakeBin -Force | Out-Null

          try {
            git init --bare $origin | Out-Null
            git -C $seed init -b main | Out-Null
            git -C $seed config user.name 'pc-setup CI'
            git -C $seed config user.email 'pc-setup-ci@example.invalid'
            Set-Content -LiteralPath (Join-Path $seed 'state.txt') -Value 'main'
            $seedWindowsDir = Join-Path $seed 'platforms\windows-11'
            New-Item -ItemType Directory -Path $seedWindowsDir -Force | Out-Null
            Set-Content -LiteralPath (Join-Path $seedWindowsDir 'install-apps.ps1') -Value '# test fixture: no-op desktop app convergence'
            git -C $seed add state.txt platforms/windows-11/install-apps.ps1
            git -C $seed commit -m 'main' | Out-Null

            $originUri = [System.Uri]::new($origin).AbsoluteUri
            git -C $seed remote add origin $originUri
            git -C $seed push -u origin main | Out-Null

            git -C $seed switch -c test-ref | Out-Null
            Set-Content -LiteralPath (Join-Path $seed 'state.txt') -Value 'test-ref'
            git -C $seed commit -am 'test ref' | Out-Null
            git -C $seed push -u origin test-ref | Out-Null

            git clone --branch main --single-branch $originUri $checkout | Out-Null
            if ((git -C $checkout branch --list test-ref)) {
              throw 'test-ref unexpectedly exists before bootstrap.'
            }

            @'
          @echo off
          if "%1"=="list" (
            echo Notion Notion.Notion 1.0.0
            exit /b 0
          )
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $fakeBin 'winget.cmd')

            @'
          @echo off
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $fakeBin 'mise.cmd')

          @'
          @echo off
          exit /b 0
          '@ | Set-Content -LiteralPath (Join-Path $secondFakeBin 'mise.cmd')

            $env:PATH = "$fakeBin;$secondFakeBin;$env:PATH"
            $env:PC_SETUP_REPO_URL = $originUri
            $env:PC_SETUP_REF = 'test-ref'
            $env:PC_SETUP_DIR = $checkout

            Invoke-Expression (Get-Content -LiteralPath ./bootstrap.ps1 -Raw)

            $branch = git -C $checkout branch --show-current
            if ($branch -ne 'test-ref') {
              throw "bootstrap did not switch to test-ref: $branch"
            }

            $state = (Get-Content -LiteralPath (Join-Path $checkout 'state.txt') -Raw).Trim()
            if ($state -ne 'test-ref') {
              throw "bootstrap did not fast-forward to test-ref content: $state"
            }

            $upstream = git -C $checkout rev-parse --abbrev-ref --symbolic-full-name '@{upstream}'
            if ($upstream -ne 'origin/test-ref') {
              throw "test-ref does not track origin/test-ref: $upstream"
            }
          }
          finally {
            Remove-Item Env:PC_SETUP_REPO_URL -ErrorAction SilentlyContinue
            Remove-Item Env:PC_SETUP_REF -ErrorAction SilentlyContinue
            Remove-Item Env:PC_SETUP_DIR -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          }

  nix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Nix
        uses: NixOS/nix-installer-action@main

      - name: Validate NixOS bootstrap documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [Path("README.md"), Path("platforms/nixos/README.md")]
          required = [
              "--extra-experimental-features 'nix-command flakes'",
              "run --no-write-lock-file 'github:rebuildup/pc-setup?dir=platforms/nixos'",
          ]

          for path in files:
              text = path.read_text()
              for marker in required:
                  if marker not in text:
                      raise SystemExit(f"{path}: missing canonical NixOS bootstrap marker: {marker}")
          PY

      - name: Evaluate NixOS profile
        run: nix flake check --no-build --no-write-lock-file ./platforms/nixos

      - name: Build NixOS mise compatibility wrapper
        run: nix build --no-link --no-write-lock-file ./platforms/nixos#mise-bootstrap-fhs

      - name: Build NixOS persistent CLI wrapper baseline
        run: |
          nix build --no-write-lock-file --out-link result-user-baseline ./platforms/nixos#user-baseline
          for command in git git-lfs mise claude opencode node cargo gcloud wget gcc clang lldb cmake ninja make pkg-config; do
            test -x "result-user-baseline/bin/$command"
          done
          grep -Fq 'mise -C' "$(readlink -f result-user-baseline/bin/claude)"
          grep -Fq 'pc-setup-mise-bootstrap-fhs' "$(readlink -f result-user-baseline/bin/opencode)"

      - name: Validate bootstrap shell activation guidance
        run: |
          grep -Fq 'this process cannot modify the parent shell PATH' platforms/nixos/flake.nix
          grep -Fq 'source %s/.config/pc-setup/shell-init.bash' platforms/nixos/flake.nix
          grep -Fq 'bootstrap is not complete' platforms/nixos/flake.nix
          grep -Fq 'normal_shell_path="$user_baseline_link/bin:/run/current-system/sw/bin:$HOME/.local/bin"' platforms/nixos/flake.nix
          ! grep -Fq 'PATH="$user_baseline_link/bin:$PATH"' platforms/nixos/flake.nix
          grep -Fq 'GitHub HTTPS credential helper is configured through gh' platforms/nixos/verify.sh

      - name: Validate nix-ld boundary
        run: grep -F 'programs.nix-ld.enable = true;' platforms/nixos/modules/system.nix
