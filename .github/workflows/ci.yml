name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "release-*"

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Validate repository
        run: ./scripts/ci.sh
