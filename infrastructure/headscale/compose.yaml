name: devnode-headscale
services:
  headscale:
    image: ghcr.io/juanfont/headscale:0.29.6
    command: serve
    # Config files are root-only on the host; all Linux capabilities are dropped.
    user: "0:0"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:8080/tcp"
      - "443:8443/tcp"
    volumes:
      - type: bind
        source: ./config.yaml
        target: /etc/headscale/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./policy.json
        target: /etc/headscale/policy.json
        read_only: true
        bind:
          create_host_path: false
      - state:/var/lib/headscale
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  state:
